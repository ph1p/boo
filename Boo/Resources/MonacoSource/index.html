<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Boo Monaco</title>
    <style>
      :root {
        --boo-bg: #1e1e1e;
        --boo-fg: #d4d4d4;
        --boo-border: #3c3c3c;
        --boo-accent: #569cd6;
      }

      html,
      body {
        font-family:
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          Roboto,
          Oxygen,
          Ubuntu,
          Cantarell,
          "Open Sans",
          "Helvetica Neue",
          sans-serif;
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: transparent;
      }

      body {
        display: flex;
        flex-direction: column;
      }

      #container {
        flex: 1;
        min-height: 0;
        width: 100%;
      }

      [hidden] {
        display: none !important;
      }

      #banner {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 6px 10px;
        font-size: 12px;
        color: var(--boo-fg);
        background: color-mix(in srgb, var(--boo-accent) 16%, var(--boo-bg));
        border-bottom: 1px solid var(--boo-border);
      }

      #banner-message {
        flex: 1;
        min-width: 0;
      }

      #banner-actions {
        display: flex;
        gap: 6px;
      }

      #banner button {
        font: inherit;
        color: var(--boo-fg);
        background: transparent;
        border: 1px solid var(--boo-border);
        border-radius: 4px;
        padding: 2px 10px;
        cursor: pointer;
      }

      #banner button:hover {
        background: color-mix(in srgb, var(--boo-fg) 10%, transparent);
      }

      #status {
        display: flex;
        align-items: center;
        gap: 14px;
        height: 22px;
        padding: 0 10px;
        font-size: 11px;
        white-space: nowrap;
        overflow: hidden;
        color: color-mix(in srgb, var(--boo-fg) 65%, transparent);
        background: var(--boo-bg);
        border-top: 1px solid var(--boo-border);
        user-select: none;
        -webkit-user-select: none;
      }

      #status .spacer {
        flex: 1;
      }

      #status button {
        font: inherit;
        color: inherit;
        background: none;
        border: none;
        padding: 0;
        cursor: pointer;
      }

      .status-pick {
        position: relative;
        cursor: pointer;
      }

      .status-pick select {
        position: absolute;
        inset: 0;
        width: 100%;
        opacity: 0;
        cursor: pointer;
      }

      #status button:hover,
      .status-pick:hover {
        color: var(--boo-fg);
      }
    </style>
  </head>
  <body>
    <div id="banner" hidden>
      <span id="banner-message"></span>
      <span id="banner-actions"></span>
    </div>
    <div id="container"></div>
    <div id="status" hidden>
      <span id="status-position"></span>
      <span id="status-selection"></span>
      <span class="spacer"></span>
      <label class="status-pick" title="Indentation">
        <span id="status-indent"></span>
        <select id="indent-select"></select>
      </label>
      <span id="status-encoding" title="Encoding"></span>
      <button id="status-eol" title="Line endings (click to switch)"></button>
      <label class="status-pick" title="Language">
        <span id="status-language"></span>
        <select id="language-select"></select>
      </label>
    </div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
