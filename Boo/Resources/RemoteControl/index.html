<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Boo Remote Control</title>
<style>
  :root {
    --bg: #16181d;
    --panel: #1e2128;
    --edge: #2c313a;
    --text: #d8dee9;
    --dim: #7a8391;
    --accent: #7aa2f7;
    --red: #f7768e;
    --green: #9ece6a;
    --yellow: #e0af68;
    --blue: #7aa2f7;
    --magenta: #bb9af7;
    --cyan: #7dcfff;
    --screen-bg: #16181d;
    --screen-fg: #d8dee9;
    --font-size: 12px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    font-size: 13px;
    display: flex;
    flex-direction: column;
    transition: background 0.3s;
  }
  header {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 12px;
    background: var(--panel);
    border-bottom: 1px solid var(--edge);
  }
  header .logo { font-weight: 700; color: var(--accent); }
  header .title {
    color: var(--dim);
    font-size: 11px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    flex: 1;
  }
  .dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--dim);
    flex: none;
  }
  .dot.live { background: var(--green); box-shadow: 0 0 6px var(--green); }
  .dot.err { background: var(--red); box-shadow: 0 0 6px var(--red); }
  .fontbtns { display: flex; gap: 4px; }
  .fontbtns button {
    border: 1px solid var(--edge);
    border-radius: 4px;
    background: transparent;
    color: var(--dim);
    font: inherit;
    font-size: 11px;
    padding: 2px 8px;
    cursor: pointer;
  }
  .bar {
    display: flex;
    gap: 6px;
    padding: 6px 12px;
    overflow-x: auto;
    background: var(--panel);
    border-bottom: 1px solid var(--edge);
    scrollbar-width: none;
  }
  .bar:empty { display: none; }
  .bar::-webkit-scrollbar { display: none; }
  .pill {
    border: 1px solid var(--edge);
    border-radius: 999px;
    background: transparent;
    color: var(--dim);
    padding: 4px 12px;
    font: inherit;
    font-size: 12px;
    white-space: nowrap;
    cursor: pointer;
    transition: color 0.15s, background 0.15s;
  }
  .pill.active { color: var(--screen-bg); background: var(--accent); border-color: var(--accent); font-weight: 600; }
  main {
    flex: 1;
    overflow: auto;
    background: var(--screen-bg);
    -webkit-overflow-scrolling: touch;
  }
  #screen {
    white-space: pre;
    font-size: var(--font-size);
    line-height: 1.4;
    color: var(--screen-fg);
    padding: 10px 12px calc(10px + env(safe-area-inset-bottom));
    min-height: 100%;
  }
  #screen .err  { color: var(--red); }
  #screen .warn { color: var(--yellow); }
  #screen .good { color: var(--green); }
  #screen .add  { color: var(--green); }
  #screen .del  { color: var(--red); }
  #screen .hunk { color: var(--magenta); }
  #screen .prompt { color: var(--accent); font-weight: 700; }
  #screen .url  { color: var(--blue); text-decoration: underline; }
  #screen .path { color: var(--cyan); }
  #screen .num  { color: var(--magenta); }
  #cwd {
    color: var(--dim);
    font-size: 11px;
    padding: 4px 12px;
    border-top: 1px solid var(--edge);
    background: var(--panel);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  footer {
    background: var(--panel);
    border-top: 1px solid var(--edge);
    padding: 8px 12px calc(10px + env(safe-area-inset-bottom));
  }
  .keys { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 8px; scrollbar-width: none; }
  .keys::-webkit-scrollbar { display: none; }
  .key {
    border: 1px solid var(--edge);
    border-radius: 6px;
    background: var(--bg);
    color: var(--text);
    padding: 7px 11px;
    font: inherit;
    font-size: 12px;
    white-space: nowrap;
    cursor: pointer;
  }
  .key:active, .pill:active, .fontbtns button:active { opacity: 0.5; }
  .inputrow { display: flex; gap: 8px; }
  #cmd {
    flex: 1;
    min-width: 0;
    background: var(--bg);
    border: 1px solid var(--edge);
    border-radius: 8px;
    color: var(--text);
    font: inherit;
    padding: 9px 12px;
    outline: none;
  }
  #cmd:focus { border-color: var(--accent); }
  #send {
    background: var(--accent);
    border: none;
    border-radius: 8px;
    color: var(--screen-bg);
    font: inherit;
    font-weight: 700;
    padding: 9px 18px;
    cursor: pointer;
  }
  #auth {
    position: fixed;
    inset: 0;
    background: var(--bg);
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    padding: 24px;
    text-align: center;
    z-index: 10;
  }
  #auth .logo { font-size: 28px; font-weight: 700; color: var(--accent); }
  #auth .hint { color: var(--dim); font-size: 12px; line-height: 1.6; }
  #auth input {
    width: 100%;
    max-width: 380px;
    background: var(--panel);
    border: 1px solid var(--edge);
    border-radius: 8px;
    color: var(--text);
    font: inherit;
    padding: 12px;
    text-align: center;
    outline: none;
  }
  #auth input:focus { border-color: var(--accent); }
</style>
</head>
<body>
  <header>
    <span class="dot" id="dot"></span>
    <span class="logo">boo</span>
    <span class="title" id="title">remote control</span>
    <span class="fontbtns">
      <button id="fontdown" title="Smaller text">A−</button>
      <button id="fontup" title="Larger text">A+</button>
    </span>
  </header>
  <div class="bar" id="workspaces"></div>
  <div class="bar" id="tabs"></div>
  <main id="scroller"><div id="screen"></div></main>
  <div id="cwd"></div>
  <footer>
    <div class="keys">
      <button class="key" data-key="ctrl_c">^C</button>
      <button class="key" data-key="ctrl_d">^D</button>
      <button class="key" data-key="ctrl_z">^Z</button>
      <button class="key" data-key="ctrl_l">^L</button>
      <button class="key" data-key="tab">⇥</button>
      <button class="key" data-key="escape">esc</button>
      <button class="key" data-key="up">↑</button>
      <button class="key" data-key="down">↓</button>
      <button class="key" data-key="left">←</button>
      <button class="key" data-key="right">→</button>
      <button class="key" data-key="backspace">⌫</button>
    </div>
    <form class="inputrow" id="form">
      <input id="cmd" type="text" autocomplete="off" autocapitalize="off"
        autocorrect="off" spellcheck="false" placeholder="type a command, ⏎ to run">
      <button id="send" type="submit">run</button>
    </form>
  </footer>
  <div id="auth">
    <div class="logo">boo</div>
    <div>Session token required.</div>
    <div class="hint">In Boo: Terminal → Copy Remote Control URL,<br>then open that link or paste it below.</div>
    <input id="tokeninput" type="text" placeholder="paste token or full URL">
  </div>

<script>
(() => {
  "use strict";

  let token = (location.hash || "").replace(/^#/, "") || localStorage.getItem("boo_token") || "";
  if (location.hash) {
    localStorage.setItem("boo_token", token);
    history.replaceState(null, "", location.pathname);
  }

  const $ = (id) => document.getElementById(id);
  let lastState = "";
  let polling = null;

  // --- Theme -----------------------------------------------------------

  // Mix two #rrggbb colors: ratio 0 → a, 1 → b.
  function mix(a, b, ratio) {
    const pa = parseInt(a.slice(1), 16), pb = parseInt(b.slice(1), 16);
    const ch = (shift) => {
      const va = (pa >> shift) & 0xff, vb = (pb >> shift) & 0xff;
      return Math.round(va + (vb - va) * ratio);
    };
    return "#" + [16, 8, 0].map((s) => ch(s).toString(16).padStart(2, "0")).join("");
  }

  let themeKey = "";
  function applyTheme(t) {
    if (!t || !t.background) return;
    const key = t.name + t.background;
    if (key === themeKey) return;
    themeKey = key;
    const r = document.documentElement.style;
    const bg = t.background, fg = t.foreground;
    r.setProperty("--screen-bg", bg);
    r.setProperty("--screen-fg", fg);
    r.setProperty("--bg", bg);
    r.setProperty("--panel", mix(bg, fg, 0.05));
    r.setProperty("--edge", mix(bg, fg, 0.14));
    r.setProperty("--text", fg);
    r.setProperty("--dim", mix(bg, fg, 0.55));
    r.setProperty("--accent", t.accent || t.cursor);
    const ansi = t.ansi || [];
    // Prefer bright variants when the theme provides them (indices 9-14).
    const pick = (normal, bright) => ansi[bright] || ansi[normal];
    if (ansi.length >= 8) {
      r.setProperty("--red", pick(1, 9));
      r.setProperty("--green", pick(2, 10));
      r.setProperty("--yellow", pick(3, 11));
      r.setProperty("--blue", pick(4, 12));
      r.setProperty("--magenta", pick(5, 13));
      r.setProperty("--cyan", pick(6, 14));
    }
    const meta = document.querySelector('meta[name="theme-color"]') || (() => {
      const m = document.createElement("meta");
      m.name = "theme-color";
      document.head.appendChild(m);
      return m;
    })();
    meta.content = mix(bg, fg, 0.05);
  }

  // --- ghostty-vt WebAssembly renderer ----------------------------------
  // The app sends the viewport as VT sequences (styles, colors, palette).
  // libghostty-vt compiled to wasm replays them into a real terminal and
  // formats the screen as HTML — the same emulator that rendered it in Boo.

  const GHOSTTY_SUCCESS = 0;
  const GHOSTTY_FORMATTER_FORMAT_HTML = 2;

  let wasm = null;       // { exports, layout } once loaded
  const utf8encode = new TextEncoder();

  async function loadWasm() {
    try {
      const res = await fetch("/ghostty-vt.wasm");
      if (!res.ok) return;
      const bytes = await res.arrayBuffer();
      const module = await WebAssembly.instantiate(bytes, {
        env: { log: () => {} }
      });
      const exports = module.instance.exports;
      const jsonPtr = exports.ghostty_type_json();
      const mem = new Uint8Array(exports.memory.buffer, jsonPtr);
      const end = mem.indexOf(0);
      const layout = JSON.parse(new TextDecoder().decode(mem.subarray(0, end)));
      wasm = { exports, layout };
    } catch (e) {
      console.warn("ghostty-vt.wasm unavailable, falling back to plain text", e);
    }
  }

  function setField(view, structName, fieldName, value) {
    const field = wasm.layout[structName].fields[fieldName];
    switch (field.type) {
      case "u8": case "bool": view.setUint8(field.offset, value); break;
      case "u16": view.setUint16(field.offset, value, true); break;
      case "u32": case "enum": view.setUint32(field.offset, value, true); break;
      case "u64": view.setBigUint64(field.offset, BigInt(value), true); break;
      default: throw new Error("unsupported field type: " + field.type);
    }
  }

  // Replay a VT snapshot into a wasm terminal and return the screen as HTML.
  function vtToHTML(vtText, cols, rows) {
    const ex = wasm.exports;
    const buf = () => ex.memory.buffer;
    let termPtr = 0, fmtPtr = 0;
    try {
      // Terminal
      const termOptsSize = wasm.layout["GhosttyTerminalOptions"].size;
      const termOptsPtr = ex.ghostty_wasm_alloc_u8_array(termOptsSize);
      new Uint8Array(buf(), termOptsPtr, termOptsSize).fill(0);
      const termOpts = new DataView(buf(), termOptsPtr, termOptsSize);
      setField(termOpts, "GhosttyTerminalOptions", "cols", cols);
      setField(termOpts, "GhosttyTerminalOptions", "rows", rows);
      setField(termOpts, "GhosttyTerminalOptions", "max_scrollback", 0);
      const termPtrPtr = ex.ghostty_wasm_alloc_opaque();
      const newResult = ex.ghostty_terminal_new(0, termPtrPtr, termOptsPtr);
      ex.ghostty_wasm_free_u8_array(termOptsPtr, termOptsSize);
      if (newResult !== GHOSTTY_SUCCESS) throw new Error("terminal_new: " + newResult);
      termPtr = new DataView(buf()).getUint32(termPtrPtr, true);
      ex.ghostty_wasm_free_opaque(termPtrPtr);

      // Replay the snapshot
      const vtBytes = utf8encode.encode(vtText);
      const dataPtr = ex.ghostty_wasm_alloc_u8_array(vtBytes.length);
      new Uint8Array(buf()).set(vtBytes, dataPtr);
      ex.ghostty_terminal_vt_write(termPtr, dataPtr, vtBytes.length);
      ex.ghostty_wasm_free_u8_array(dataPtr, vtBytes.length);

      // HTML formatter (palette emitted as a <style> block with CSS vars)
      const fmtOptsSize = wasm.layout["GhosttyFormatterTerminalOptions"].size;
      const fmtOptsPtr = ex.ghostty_wasm_alloc_u8_array(fmtOptsSize);
      new Uint8Array(buf(), fmtOptsPtr, fmtOptsSize).fill(0);
      const fmtOpts = new DataView(buf(), fmtOptsPtr, fmtOptsSize);
      setField(fmtOpts, "GhosttyFormatterTerminalOptions", "size", fmtOptsSize);
      setField(fmtOpts, "GhosttyFormatterTerminalOptions", "emit", GHOSTTY_FORMATTER_FORMAT_HTML);
      setField(fmtOpts, "GhosttyFormatterTerminalOptions", "trim", 1);
      const extraOffset = wasm.layout["GhosttyFormatterTerminalOptions"].fields["extra"].offset;
      const extraLayout = wasm.layout["GhosttyFormatterTerminalExtra"];
      fmtOpts.setUint32(extraOffset + extraLayout.fields["size"].offset, extraLayout.size, true);
      fmtOpts.setUint8(extraOffset + extraLayout.fields["palette"].offset, 1);
      const screenOffset = extraLayout.fields["screen"].offset;
      const screenLayout = wasm.layout["GhosttyFormatterScreenExtra"];
      fmtOpts.setUint32(
        extraOffset + screenOffset + screenLayout.fields["size"].offset, screenLayout.size, true);

      const fmtPtrPtr = ex.ghostty_wasm_alloc_opaque();
      const fmtResult = ex.ghostty_formatter_terminal_new(0, fmtPtrPtr, termPtr, fmtOptsPtr);
      ex.ghostty_wasm_free_u8_array(fmtOptsPtr, fmtOptsSize);
      if (fmtResult !== GHOSTTY_SUCCESS) throw new Error("formatter_new: " + fmtResult);
      fmtPtr = new DataView(buf()).getUint32(fmtPtrPtr, true);
      ex.ghostty_wasm_free_opaque(fmtPtrPtr);

      const outPtrPtr = ex.ghostty_wasm_alloc_opaque();
      const outLenPtr = ex.ghostty_wasm_alloc_usize();
      const formatResult = ex.ghostty_formatter_format_alloc(fmtPtr, 0, outPtrPtr, outLenPtr);
      if (formatResult !== GHOSTTY_SUCCESS) {
        ex.ghostty_wasm_free_opaque(outPtrPtr);
        ex.ghostty_wasm_free_usize(outLenPtr);
        throw new Error("format_alloc: " + formatResult);
      }
      const outPtr = new DataView(buf()).getUint32(outPtrPtr, true);
      const outLen = new DataView(buf()).getUint32(outLenPtr, true);
      const html = new TextDecoder().decode(new Uint8Array(buf(), outPtr, outLen));
      ex.ghostty_free(0, outPtr, outLen);
      ex.ghostty_wasm_free_opaque(outPtrPtr);
      ex.ghostty_wasm_free_usize(outLenPtr);
      return html;
    } finally {
      if (fmtPtr) wasm.exports.ghostty_formatter_free(fmtPtr);
      if (termPtr) wasm.exports.ghostty_terminal_free(termPtr);
    }
  }

  // --- Highlighting (fallback) ------------------------------------------
  // Without the wasm renderer the app's plain viewport text (no ANSI
  // attributes) is shown, with pattern-rule highlighting in theme colors.

  const escapeHTML = (s) => s.replace(/[&<>"]/g, (c) =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

  const LINE_RULES = [
    { cls: "hunk", re: /^@@[^@]*@@/ },
    { cls: "add", re: /^\+(?!\+\+)/ },
    // "-" diff line, but not an ls -l permission column (-rw-r--r--)
    { cls: "del", re: /^-(?!--)(?![rwxsStT-]{9}[\s@+])/ },
    { cls: "err", re: /\b(error|fatal|fail(ed|ure)?|exception|panic|denied|traceback|segfault)\b/i },
    { cls: "warn", re: /\b(warn(ing)?|deprecated|caution)\b/i },
    { cls: "good", re: /\b(success(ful(ly)?)?|passed|✓|ok(ay)?\b|done|complete[d]?)\b/i }
  ];

  // Token rules run on lines without a line-level class.
  const TOKEN_RE = new RegExp(
    [
      /(?:https?:\/\/[^\s'"<>]+)/.source,               // url
      /(?:(?:^|\s)(?:~|\.{1,2})?\/[\w.@~+-]+(?:\/[\w.@~+-]+)*)/.source, // path
      /(?:(?:^|\s)[❯➜»▶]\s?)/.source                     // prompt marker
    ].join("|"),
    "g"
  );

  function tokenClass(tok) {
    if (/^https?:\/\//.test(tok)) return "url";
    if (/[❯➜»▶]/.test(tok)) return "prompt";
    return "path";
  }

  function highlightLine(line) {
    if (line.length > 500) return escapeHTML(line);
    for (const rule of LINE_RULES) {
      if (rule.re.test(line)) {
        return '<span class="' + rule.cls + '">' + escapeHTML(line) + "</span>";
      }
    }
    let out = "";
    let last = 0;
    TOKEN_RE.lastIndex = 0;
    let m;
    while ((m = TOKEN_RE.exec(line)) !== null) {
      const tok = m[0];
      // Keep any leading whitespace captured by the path/prompt patterns plain.
      const lead = tok.match(/^\s*/)[0];
      const core = tok.slice(lead.length);
      out += escapeHTML(line.slice(last, m.index)) + lead
        + '<span class="' + tokenClass(core) + '">' + escapeHTML(core) + "</span>";
      last = m.index + tok.length;
    }
    out += escapeHTML(line.slice(last));
    return out;
  }

  let lastScreenText = null;
  function renderScreen(screen) {
    if (wasm && screen.vt && screen.cols > 0 && screen.rows > 0) {
      const key = "vt:" + screen.vt;
      if (key === lastScreenText) return;
      try {
        $("screen").innerHTML = vtToHTML(screen.vt, screen.cols, screen.rows);
        lastScreenText = key;
        return;
      } catch (e) {
        console.warn("wasm render failed, falling back", e);
        wasm = null; // don't retry every tick
      }
    }
    const text = screen.text || "";
    if (text === lastScreenText) return;
    lastScreenText = text;
    $("screen").innerHTML = text.split("\n").map(highlightLine).join("\n");
  }

  // --- Status / auth ---------------------------------------------------

  function setStatus(state) {
    $("dot").className = "dot" + (state === "live" ? " live" : state === "err" ? " err" : "");
  }

  async function api(cmd, extra) {
    const res = await fetch("/api/cmd", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "Authorization": "Bearer " + token
      },
      body: JSON.stringify(Object.assign({ cmd }, extra || {}))
    });
    if (res.status === 401) {
      showAuth();
      throw new Error("unauthorized");
    }
    return res.json();
  }

  function showAuth() {
    clearInterval(polling);
    polling = null;
    $("auth").style.display = "flex";
    setStatus("err");
  }

  $("tokeninput").addEventListener("change", (e) => {
    let v = e.target.value.trim();
    const hashIdx = v.indexOf("#");
    if (hashIdx >= 0) v = v.slice(hashIdx + 1);
    if (!v) return;
    token = v;
    localStorage.setItem("boo_token", token);
    $("auth").style.display = "none";
    startPolling();
  });

  // --- Font size -------------------------------------------------------

  let fontSize = parseInt(localStorage.getItem("boo_font") || "12", 10);
  function applyFont() {
    document.documentElement.style.setProperty("--font-size", fontSize + "px");
    localStorage.setItem("boo_font", String(fontSize));
  }
  $("fontup").addEventListener("click", () => { if (fontSize < 20) { fontSize++; applyFont(); } });
  $("fontdown").addEventListener("click", () => { if (fontSize > 8) { fontSize--; applyFont(); } });
  applyFont();

  // --- State / screen --------------------------------------------------

  function renderPills(container, items, onSelect) {
    container.replaceChildren(...items.map((item) => {
      const btn = document.createElement("button");
      btn.className = "pill" + (item.active ? " active" : "");
      btn.textContent = item.label;
      btn.addEventListener("click", () => onSelect(item));
      return btn;
    }));
  }

  async function refreshState() {
    const state = await api("get_state");
    if (!state.ok) return;
    applyTheme(state.theme);
    const key = JSON.stringify([state.workspaces, state.panes]);
    if (key === lastState) return;
    lastState = key;

    renderPills(
      $("workspaces"),
      state.workspaces.map((ws) => ({
        label: ws.name, active: ws.active, index: ws.index
      })),
      (ws) => api("switch_workspace", { index: ws.index }).then(refreshAll)
    );

    const activePane = state.panes.find((p) => p.active) || state.panes[0];
    const tabItems = [];
    for (const pane of state.panes) {
      for (const tab of pane.tabs) {
        tabItems.push({
          label: (state.panes.length > 1 ? "▢ " : "") + tab.title,
          active: pane.active && tab.active,
          paneId: pane.id,
          index: tab.index
        });
      }
    }
    renderPills($("tabs"), tabItems, async (tab) => {
      if (activePane && tab.paneId !== activePane.id) {
        await api("select_pane", { id: tab.paneId });
      }
      await api("select_tab", { index: tab.index });
      refreshAll();
    });
  }

  async function refreshScreen() {
    const screen = await api("get_screen");
    if (!screen.ok) return;
    const scroller = $("scroller");
    const atBottom =
      Math.abs(scroller.scrollHeight - scroller.scrollTop - scroller.clientHeight) < 40;
    renderScreen(screen);
    $("cwd").textContent = screen.cwd;
    $("title").textContent = screen.title || "remote control";
    document.title = screen.title ? screen.title + " — Boo" : "Boo Remote Control";
    if (atBottom) scroller.scrollTop = scroller.scrollHeight;
  }

  async function refreshAll() {
    try {
      await Promise.all([refreshState(), refreshScreen()]);
      setStatus("live");
    } catch (e) {
      if (e.message !== "unauthorized") setStatus("err");
    }
  }

  // Screen changes every second; workspace/tab structure rarely does.
  // Poll the screen fast, the state on every 5th tick (actions call
  // refreshAll directly, so switches still update immediately).
  let tick = 0;
  async function poll() {
    try {
      if (tick % 5 === 0) await refreshState();
      tick += 1;
      await refreshScreen();
      setStatus("live");
    } catch (e) {
      if (e.message !== "unauthorized") setStatus("err");
    }
  }

  function startPolling() {
    if (polling) clearInterval(polling);
    tick = 0;
    poll();
    polling = setInterval(poll, 1000);
  }

  // --- Input -----------------------------------------------------------

  $("form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const input = $("cmd");
    const text = input.value;
    input.value = "";
    try {
      await api("send_text", { text: text + "\r" });
      setTimeout(refreshScreen, 150);
    } catch (_) { /* handled by status */ }
  });

  document.querySelectorAll(".key").forEach((btn) => {
    btn.addEventListener("click", async () => {
      try {
        await api("send_key", { key: btn.dataset.key });
        setTimeout(refreshScreen, 150);
      } catch (_) { /* handled by status */ }
    });
  });

  loadWasm().then(() => { lastScreenText = null; });
  if (!token) {
    showAuth();
  } else {
    startPolling();
  }
})();
</script>
</body>
</html>
