<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Boo Remote Control</title>
<!-- Home-screen install. The manifest has no start_url, so the installed app
     opens the URL it was added from, #token included. -->
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Boo">
<meta name="theme-color" content="#1b1d23">
<!-- Plain, hand-written CSS. The page used to inline the Tailwind Play CDN
     (~400 KB of JS that compiled styles in the browser and re-scanned the DOM
     on every mutation, i.e. on every screen update). The server exposes only a
     handful of paths and the phone may have no internet, so everything stays
     in this one self-contained document. -->
<style>
  :root {
    --bg: #16181d;
    --panel: #1e2128;
    --raised: #262a33;
    --edge: #2c313a;
    --text: #d8dee9;
    --dim: #7a8391;
    --accent: #7aa2f7;
    --red: #f7768e;
    --green: #9ece6a;
    --yellow: #e0af68;
    --blue: #7aa2f7;
    --magenta: #bb9af7;
    --cyan: #7dcfff;
    --screen-bg: #16181d;
    --screen-fg: #d8dee9;
    --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
    --ease: cubic-bezier(0.2, 0.8, 0.2, 1);
    --safe-b: env(safe-area-inset-bottom, 0px);
    --safe-t: env(safe-area-inset-top, 0px);
  }

  *, *::before, *::after { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; }
  body {
    display: flex; flex-direction: column; overflow: hidden;
    background: var(--bg); color: var(--text);
    font: 13px/1.4 var(--mono);
    -webkit-font-smoothing: antialiased;
    overscroll-behavior: none;
  }
  button, input { font: inherit; color: inherit; }
  button { cursor: pointer; border: 0; background: none; padding: 0; }
  button:disabled { opacity: 0.5; cursor: default; }
  .hidden { display: none !important; }
  .icon { width: 16px; height: 16px; flex: none; fill: none; stroke: currentColor;
          stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }
  .no-bar { scrollbar-width: none; }
  .no-bar::-webkit-scrollbar { display: none; }
  :focus-visible { outline: none; box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 30%, transparent); }

  /* --- Header ------------------------------------------------------------ */
  header {
    flex: none; display: flex; align-items: center; gap: 10px;
    padding: calc(8px + var(--safe-t)) 12px 8px;
    background: var(--panel); border-bottom: 1px solid var(--edge);
  }
  .status { position: relative; width: 9px; height: 9px; flex: none; }
  .status i { position: absolute; inset: 0; border-radius: 50%; background: var(--dim);
              transition: background 300ms; }
  .status.live i { background: var(--green); box-shadow: 0 0 8px var(--green); }
  .status.err i { background: var(--red); box-shadow: 0 0 8px var(--red); }
  .status.live::after { content: ""; position: absolute; inset: 0; border-radius: 50%;
                        background: var(--green); animation: ping 1.6s var(--ease) infinite; }
  @keyframes ping { 70%, 100% { transform: scale(2.4); opacity: 0; } 0% { opacity: 0.5; } }
  .brand { display: flex; flex-direction: column; min-width: 0; flex: 1; line-height: 1.2; }
  .brand b { font-size: 13px; letter-spacing: -0.01em; }
  .brand span { font-size: 10.5px; color: var(--dim); overflow: hidden;
                text-overflow: ellipsis; white-space: nowrap; }
  .tools { display: flex; align-items: center; gap: 4px; flex: none; }
  .fontlabel { width: 22px; text-align: center; font-size: 10px; color: var(--dim);
               font-variant-numeric: tabular-nums; }

  .iconbtn {
    display: inline-flex; align-items: center; justify-content: center; flex: none;
    width: 32px; height: 32px; border-radius: 8px;
    border: 1px solid var(--edge); color: var(--dim);
    background: color-mix(in srgb, var(--raised) 60%, transparent);
    transition: transform 120ms var(--ease), background 120ms, color 120ms;
  }
  .iconbtn:active { transform: scale(0.9); background: var(--edge); }
  .iconbtn.on { color: var(--screen-bg); background: var(--accent); border-color: transparent; }

  /* --- Strips (workspaces, tabs) ----------------------------------------- */
  .strip {
    flex: none; display: flex; align-items: center; gap: 6px; overflow-x: auto;
    padding: 7px 12px; border-bottom: 1px solid var(--edge);
    background: color-mix(in srgb, var(--panel) 70%, var(--bg));
  }
  .strip:empty { display: none; }
  .strip .sep { flex: none; width: 1px; align-self: stretch; margin: 2px 2px; background: var(--edge); }
  .strip .label { flex: none; font-size: 10px; text-transform: uppercase; letter-spacing: 0.06em;
                  color: var(--dim); padding: 0 2px; }
  .pill {
    flex: none; display: inline-flex; align-items: center; gap: 6px; max-width: 220px;
    padding: 5px 11px; border-radius: 999px; font-size: 12px; line-height: 16px;
    border: 1px solid var(--edge); color: var(--dim); white-space: nowrap;
    background: color-mix(in srgb, var(--raised) 60%, transparent);
    transition: transform 120ms var(--ease), background 150ms, color 150ms;
  }
  .pill span { overflow: hidden; text-overflow: ellipsis; }
  .pill:active { transform: scale(0.95); }
  .pill.active { background: var(--accent); color: var(--screen-bg); font-weight: 600;
                 border-color: transparent; box-shadow: 0 2px 10px -3px var(--accent); }
  .pill .swatch { width: 8px; height: 8px; border-radius: 50%; flex: none; }

  /* --- Pane toolbar ------------------------------------------------------ */
  .panebar {
    flex: none; display: flex; align-items: center; gap: 6px;
    padding: 6px 12px; border-bottom: 1px solid var(--edge); background: var(--panel);
  }
  .panebar .tabs { flex: 1; min-width: 0; display: flex; gap: 6px; overflow-x: auto; }
  .panebar .iconbtn { width: 30px; height: 30px; }
  @media (max-width: 560px) {
    .panebar { flex-wrap: wrap; row-gap: 6px; }
    .panebar .tabs { order: 9; flex-basis: 100%; }
    .panebar #viewmode { margin-right: auto; }
  }
  .minimap {
    flex: none; display: flex; width: 44px; height: 30px; padding: 3px; gap: 2px;
    border-radius: 8px; border: 1px solid var(--edge); background: var(--bg);
  }
  .minimap .mm-split { display: flex; flex: 1; gap: 2px; min-width: 0; min-height: 0; }
  .minimap .mm-split.v { flex-direction: column; }
  .minimap .mm-leaf { flex: 1; border-radius: 2px; background: var(--raised); min-width: 0; min-height: 0; }
  .minimap .mm-leaf.active { background: var(--accent); }

  /* --- Agents ------------------------------------------------------------ */
  #agents {
    flex: none; display: flex; flex-direction: column; gap: 8px; max-height: 45vh; overflow-y: auto;
    padding: 8px 12px; background: var(--panel); border-bottom: 1px solid var(--edge);
  }
  #agents:empty { display: none; }
  .agent { display: flex; flex-direction: column; gap: 8px; min-width: 0;
           padding: 10px; border-radius: 10px; border: 1px solid var(--edge); background: var(--raised); }
  .agent.waiting { border-color: var(--yellow); }
  .agent-head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; font-size: 12px; }
  .agent-head b { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .agent-head span { color: var(--dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .agent pre { margin: 0; max-height: 12rem; overflow: auto; padding: 8px; border-radius: 6px;
               background: var(--screen-bg); color: var(--screen-fg); font: 11px/1.35 var(--mono); }
  .agent-actions { display: flex; gap: 8px; }
  .agent-actions .key { flex: 1; font-weight: 600; }

  /* --- Stage: split layout ----------------------------------------------- */
  #stage { position: relative; flex: 1; min-height: 0; display: flex; background: var(--edge); }
  .split { display: flex; flex: 1; min-width: 0; min-height: 0; gap: 1px; }
  .split.v { flex-direction: column; }
  .split > * { min-width: 0; min-height: 0; }
  .pane {
    position: relative; display: flex; flex-direction: column; flex: 1;
    background: var(--screen-bg); overflow: hidden;
  }
  .pane::after {
    content: ""; position: absolute; inset: 0; pointer-events: none;
    border: 1.5px solid transparent; transition: border-color 150ms;
  }
  .multi .pane.active::after { border-color: var(--accent); }
  .multi .pane:not(.active) .screen { opacity: 0.72; }
  .pane-head {
    flex: none; display: flex; align-items: center; gap: 6px; min-width: 0;
    padding: 3px 8px; font-size: 10.5px; color: var(--dim);
    background: color-mix(in srgb, var(--panel) 85%, transparent);
    border-bottom: 1px solid var(--edge);
  }
  .pane.active .pane-head { color: var(--text); }
  .pane-head .t { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pane-head .n:empty { display: none; }
  .pane-head .n { flex: none; font-size: 9.5px; padding: 0 5px; border-radius: 999px; background: var(--raised); }
  .single .pane-head { display: none; }
  .screen-wrap {
    flex: 1; min-height: 0; overflow: auto; -webkit-overflow-scrolling: touch;
    overscroll-behavior: contain;
  }
  .screen {
    min-height: 100%; width: max-content; min-width: 100%;
    padding: 8px 10px calc(10px + var(--safe-b));
    color: var(--screen-fg); white-space: pre;
    font-family: var(--mono); line-height: 1.25;
    transition: opacity 150ms;
  }
  .multi .screen { padding: 4px 6px; }
  /* The ghostty HTML formatter emits an inline `font-family: monospace` on its
     wrapper; ours must win so the measured cell width stays right. */
  .screen > div { font-family: var(--mono) !important; }
  .placeholder { display: flex; flex: 1; align-items: center; justify-content: center; gap: 8px;
                 padding: 16px; color: var(--dim); font-size: 12px; text-align: center; }

  /* Fallback highlighting when the wasm renderer is unavailable. */
  .screen .err  { color: var(--red); }
  .screen .warn { color: var(--yellow); }
  .screen .good, .screen .add { color: var(--green); }
  .screen .del  { color: var(--red); }
  .screen .hunk { color: var(--magenta); }
  .screen .prompt { color: var(--accent); font-weight: 700; }
  .screen .url  { color: var(--blue); text-decoration: underline; }
  .screen .path { color: var(--cyan); }

  #tobottom { position: absolute; right: 12px; bottom: 12px; z-index: 5; width: 40px; height: 40px;
              color: var(--text); background: var(--raised); box-shadow: 0 6px 18px -6px rgb(0 0 0 / 0.6); }

  /* --- Footer: keys + input ---------------------------------------------- */
  footer {
    flex: none; padding: 8px 12px calc(8px + var(--safe-b));
    background: var(--panel); border-top: 1px solid var(--edge);
    box-shadow: 0 -8px 24px -12px rgb(0 0 0 / 0.45);
  }
  .cwd { display: flex; align-items: center; gap: 6px; margin-bottom: 6px; font-size: 10.5px; color: var(--dim); }
  .cwd span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; direction: rtl; text-align: left; }
  .keys { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; margin-bottom: 8px; }
  .key {
    flex: none; display: inline-flex; align-items: center; justify-content: center; gap: 4px;
    min-width: 42px; padding: 8px 10px; border-radius: 8px; font-size: 12px; line-height: 16px;
    border: 1px solid var(--edge); background: var(--raised); color: var(--text);
    box-shadow: 0 1px 0 0 var(--edge), 0 1px 2px rgb(0 0 0 / 0.25);
    transition: transform 80ms var(--ease), background 80ms;
    user-select: none; -webkit-user-select: none;
  }
  .key:active { transform: translateY(1px); background: var(--edge); box-shadow: none; }
  .key.on { background: var(--accent); color: var(--screen-bg); border-color: transparent; }
  .key b { font-weight: 600; }
  form { display: flex; align-items: center; gap: 8px; }
  .field { position: relative; flex: 1; min-width: 0; display: flex; align-items: center; }
  .field .icon { position: absolute; left: 11px; color: var(--dim); pointer-events: none; }
  .field input {
    width: 100%; padding: 10px 12px 10px 34px; border-radius: 12px;
    border: 1px solid var(--edge); background: var(--bg); color: var(--text); font-size: 16px;
    transition: border-color 150ms, box-shadow 150ms;
  }
  .field input::placeholder { color: color-mix(in srgb, var(--dim) 75%, transparent); }
  .field input:focus { outline: none; border-color: var(--accent);
                       box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 28%, transparent); }
  .send {
    flex: none; display: inline-flex; align-items: center; gap: 6px; padding: 10px 14px;
    border-radius: 12px; background: var(--accent); color: var(--screen-bg); font-weight: 700;
    transition: transform 120ms var(--ease);
  }
  .send:active { transform: scale(0.95); }

  /* --- Auth -------------------------------------------------------------- */
  #auth { position: fixed; inset: 0; z-index: 30; display: flex; align-items: center; justify-content: center;
          padding: 24px; background: color-mix(in srgb, var(--bg) 94%, transparent);
          -webkit-backdrop-filter: blur(4px); backdrop-filter: blur(4px); }
  .auth-card { display: flex; flex-direction: column; align-items: center; gap: 16px; width: 100%;
               max-width: 360px; padding: 28px; border-radius: 16px; text-align: center;
               border: 1px solid var(--edge); background: var(--panel);
               box-shadow: 0 25px 50px -12px rgb(0 0 0 / 0.5); }
  .auth-card .hint { display: flex; gap: 8px; padding: 12px; border-radius: 12px; text-align: left;
                     font-size: 11.5px; line-height: 1.55; color: var(--dim);
                     border: 1px solid var(--edge); background: color-mix(in srgb, var(--raised) 50%, transparent); }
  .auth-card input { width: 100%; padding: 10px 12px; border-radius: 12px; text-align: center; font-size: 16px;
                     border: 1px solid var(--edge); background: var(--bg); }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>

  <svg class="hidden" aria-hidden="true">
    <defs>
      <symbol id="i-ghost" viewBox="0 0 24 24">
        <path d="M12 2.75c-4 0-6.75 2.9-6.75 6.75v10.1c0 .9 1.05 1.36 1.7.74l1.3-1.24a1.2 1.2 0 0 1 1.68.03l.93.95a1.2 1.2 0 0 0 1.72 0l.93-.95a1.2 1.2 0 0 1 1.7-.02l1.32 1.24c.65.61 1.72.16 1.72-.75V9.5c0-3.85-2.75-6.75-6.75-6.75Z"/>
        <path d="M9.5 10.5h.01M14.5 10.5h.01"/>
      </symbol>
      <symbol id="i-minus" viewBox="0 0 24 24"><path d="M5 12h14"/></symbol>
      <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
      <symbol id="i-type" viewBox="0 0 24 24"><path d="M4 7V5h16v2M9 19h6M12 5v14"/></symbol>
      <symbol id="i-folder" viewBox="0 0 24 24"><path d="M3 7.5A1.5 1.5 0 0 1 4.5 6h4l2 2.5h7A1.5 1.5 0 0 1 19 10v7a1.5 1.5 0 0 1-1.5 1.5h-13A1.5 1.5 0 0 1 3 17V7.5Z"/></symbol>
      <symbol id="i-split-h" viewBox="0 0 24 24"><rect x="3.5" y="4.5" width="17" height="15" rx="2"/><path d="M12 4.5v15"/></symbol>
      <symbol id="i-split-v" viewBox="0 0 24 24"><rect x="3.5" y="4.5" width="17" height="15" rx="2"/><path d="M3.5 12h17"/></symbol>
      <symbol id="i-grid" viewBox="0 0 24 24"><rect x="3.5" y="4.5" width="17" height="15" rx="2"/><path d="M12 4.5v15M12 12h8.5"/></symbol>
      <symbol id="i-focus" viewBox="0 0 24 24"><path d="M4 9V5.5A1.5 1.5 0 0 1 5.5 4H9M15 4h3.5A1.5 1.5 0 0 1 20 5.5V9M20 15v3.5a1.5 1.5 0 0 1-1.5 1.5H15M9 20H5.5A1.5 1.5 0 0 1 4 18.5V15"/></symbol>
      <symbol id="i-fit" viewBox="0 0 24 24"><path d="M3 12h18M7 8l-4 4 4 4M17 8l4 4-4 4"/></symbol>
      <symbol id="i-close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
      <symbol id="i-arrow-up" viewBox="0 0 24 24"><path d="M12 19V5M6 11l6-6 6 6"/></symbol>
      <symbol id="i-arrow-down" viewBox="0 0 24 24"><path d="M12 5v14M6 13l6 6 6-6"/></symbol>
      <symbol id="i-arrow-left" viewBox="0 0 24 24"><path d="M19 12H5M11 6l-6 6 6 6"/></symbol>
      <symbol id="i-arrow-right" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></symbol>
      <symbol id="i-tab" viewBox="0 0 24 24"><path d="M4 8l4 4-4 4M10 12h8M20 6v12"/></symbol>
      <symbol id="i-backspace" viewBox="0 0 24 24"><path d="M9 5h10a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H9L3 12l6-7Z"/><path d="M14.5 9.5l-4 5M10.5 9.5l4 5"/></symbol>
      <symbol id="i-send" viewBox="0 0 24 24"><path d="M4.5 12h13M11.5 6l6 6-6 6"/></symbol>
      <symbol id="i-scroll-end" viewBox="0 0 24 24"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></symbol>
      <symbol id="i-link" viewBox="0 0 24 24"><path d="M10.5 13.5a3.5 3.5 0 0 0 5 0l3-3a3.54 3.54 0 0 0-5-5l-1.5 1.5"/><path d="M13.5 10.5a3.5 3.5 0 0 0-5 0l-3 3a3.54 3.54 0 0 0 5 5L12 17"/></symbol>
    </defs>
  </svg>

  <header>
    <span class="status" id="status"><i></i></span>
    <svg class="icon" style="width:20px;height:20px;color:var(--accent)"><use href="#i-ghost"/></svg>
    <span class="brand">
      <b>boo</b>
      <span id="title">remote control</span>
    </span>
    <div class="tools">
      <button id="fontdown" class="iconbtn" title="Smaller text" aria-label="Smaller text">
        <svg class="icon"><use href="#i-minus"/></svg>
      </button>
      <span class="fontlabel" id="fontlabel">12</span>
      <button id="fontup" class="iconbtn" title="Larger text" aria-label="Larger text">
        <svg class="icon"><use href="#i-plus"/></svg>
      </button>
    </div>
  </header>

  <nav id="workspaces" class="strip no-bar" aria-label="Workspaces"></nav>

  <div class="panebar">
    <button id="viewmode" class="minimap" title="Show all panes / focus one" aria-label="Toggle split view"></button>
    <nav id="tabs" class="tabs no-bar" aria-label="Tabs"></nav>
    <button id="fit" class="iconbtn" title="Fit width" aria-label="Fit terminal to width">
      <svg class="icon"><use href="#i-fit"/></svg>
    </button>
    <button id="splitright" class="iconbtn" title="Split right" aria-label="Split right">
      <svg class="icon"><use href="#i-split-h"/></svg>
    </button>
    <button id="splitdown" class="iconbtn" title="Split down" aria-label="Split down">
      <svg class="icon"><use href="#i-split-v"/></svg>
    </button>
    <button id="zoom" class="iconbtn hidden" title="Zoom pane in Boo" aria-label="Zoom pane in Boo">
      <svg class="icon"><use href="#i-focus"/></svg>
    </button>
    <button id="closepane" class="iconbtn hidden" title="Close pane" aria-label="Close pane">
      <svg class="icon"><use href="#i-close"/></svg>
    </button>
  </div>

  <!-- Agents waiting for the user: permission prompts to approve or deny. -->
  <section id="agents"></section>

  <main id="stage" class="single">
    <div class="placeholder">connecting…</div>
  </main>

  <footer>
    <div class="cwd"><svg class="icon" style="width:13px;height:13px"><use href="#i-folder"/></svg><span id="cwd"></span></div>
    <div class="keys no-bar">
      <button class="key" data-key="escape"><b>esc</b></button>
      <button class="key" data-key="tab" aria-label="Tab"><svg class="icon"><use href="#i-tab"/></svg></button>
      <button class="key" id="ctrl" aria-pressed="false"><b>ctrl</b></button>
      <button class="key" data-key="ctrl_c"><b>^C</b></button>
      <button class="key" data-key="up" aria-label="Up"><svg class="icon"><use href="#i-arrow-up"/></svg></button>
      <button class="key" data-key="down" aria-label="Down"><svg class="icon"><use href="#i-arrow-down"/></svg></button>
      <button class="key" data-key="left" aria-label="Left"><svg class="icon"><use href="#i-arrow-left"/></svg></button>
      <button class="key" data-key="right" aria-label="Right"><svg class="icon"><use href="#i-arrow-right"/></svg></button>
      <button class="key" data-key="enter"><b>⏎</b></button>
      <button class="key" data-key="backspace" aria-label="Backspace"><svg class="icon"><use href="#i-backspace"/></svg></button>
      <button class="key" data-key="ctrl_d"><b>^D</b></button>
      <button class="key" data-key="ctrl_z"><b>^Z</b></button>
      <button class="key" data-key="ctrl_l"><b>^L</b></button>
      <button class="key" data-raw="\u0012"><b>^R</b></button>
      <button class="key" data-raw="\u0001"><b>^A</b></button>
      <button class="key" data-raw="\u0005"><b>^E</b></button>
      <button class="key" data-raw="\u0015"><b>^U</b></button>
      <button class="key" data-raw="\u001b[5~"><b>PgUp</b></button>
      <button class="key" data-raw="\u001b[6~"><b>PgDn</b></button>
      <button class="key" data-raw="|"><b>|</b></button>
      <button class="key" data-raw="~"><b>~</b></button>
      <button class="key" data-raw="/"><b>/</b></button>
      <button class="key" data-raw="-"><b>-</b></button>
    </div>
    <form id="form">
      <div class="field">
        <svg class="icon"><use href="#i-type"/></svg>
        <input id="cmd" type="text" autocomplete="off" autocapitalize="off" enterkeyhint="send"
          autocorrect="off" spellcheck="false" placeholder="type a command, ⏎ to run">
      </div>
      <button class="send" type="submit" aria-label="Run command">run <svg class="icon"><use href="#i-send"/></svg></button>
    </form>
  </footer>

  <div id="auth" class="hidden">
    <div class="auth-card">
      <svg class="icon" style="width:48px;height:48px;color:var(--accent)"><use href="#i-ghost"/></svg>
      <div style="font-size:17px;font-weight:700">Session token required</div>
      <div class="hint">
        <svg class="icon" style="color:var(--accent);margin-top:2px"><use href="#i-link"/></svg>
        <span>In Boo: <span style="color:var(--text)">Terminal → Copy Remote Control URL</span>,
          then open that link or paste it below.</span>
      </div>
      <input id="tokeninput" type="text" placeholder="paste token or full URL"
        autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false">
    </div>
  </div>

<script>
(() => {
  "use strict";

  // --- Storage (per-viewer conveniences only; may throw in private mode) ---
  const store = {
    get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : v; } catch (_) { return d; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch (_) { /* ignore */ } }
  };

  let token = (location.hash || "").replace(/^#/, "") || store.get("boo_token", "");
  if (location.hash) {
    store.set("boo_token", token);
    history.replaceState(null, "", location.pathname);
  }

  const $ = (id) => document.getElementById(id);
  const el = (tag, cls, text) => {
    const n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  };
  const svgIcon = (id, cls) => {
    const ns = "http://www.w3.org/2000/svg";
    const svg = document.createElementNS(ns, "svg");
    svg.setAttribute("class", "icon" + (cls ? " " + cls : ""));
    const use = document.createElementNS(ns, "use");
    use.setAttribute("href", id);
    svg.appendChild(use);
    return svg;
  };

  // --- Theme -----------------------------------------------------------

  // Mix two #rrggbb colors: ratio 0 → a, 1 → b.
  function mix(a, b, ratio) {
    const pa = parseInt(a.slice(1), 16), pb = parseInt(b.slice(1), 16);
    const ch = (shift) => {
      const va = (pa >> shift) & 0xff, vb = (pb >> shift) & 0xff;
      return Math.round(va + (vb - va) * ratio);
    };
    return "#" + [16, 8, 0].map((s) => ch(s).toString(16).padStart(2, "0")).join("");
  }

  let themeKey = "";
  function applyTheme(t) {
    if (!t || !t.background) return;
    const key = t.name + t.background;
    if (key === themeKey) return;
    themeKey = key;
    const r = document.documentElement.style;
    const bg = t.background, fg = t.foreground;
    r.setProperty("--screen-bg", bg);
    r.setProperty("--screen-fg", fg);
    r.setProperty("--bg", bg);
    r.setProperty("--panel", mix(bg, fg, 0.05));
    r.setProperty("--raised", mix(bg, fg, 0.09));
    r.setProperty("--edge", mix(bg, fg, 0.14));
    r.setProperty("--text", fg);
    r.setProperty("--dim", mix(bg, fg, 0.55));
    r.setProperty("--accent", t.accent || t.cursor);
    const ansi = t.ansi || [];
    // Prefer bright variants when the theme provides them (indices 9-14).
    const pick = (normal, bright) => ansi[bright] || ansi[normal];
    if (ansi.length >= 8) {
      r.setProperty("--red", pick(1, 9));
      r.setProperty("--green", pick(2, 10));
      r.setProperty("--yellow", pick(3, 11));
      r.setProperty("--blue", pick(4, 12));
      r.setProperty("--magenta", pick(5, 13));
      r.setProperty("--cyan", pick(6, 14));
    }
    document.querySelector('meta[name="theme-color"]').content = mix(bg, fg, 0.05);
  }

  // --- ghostty-vt WebAssembly renderer ----------------------------------
  // The app sends each viewport as VT sequences (styles, colors, palette).
  // libghostty-vt compiled to wasm replays them into a real terminal and
  // formats the screen as HTML — the same emulator that rendered it in Boo.

  const GHOSTTY_SUCCESS = 0;
  const GHOSTTY_FORMATTER_FORMAT_HTML = 2;

  let wasm = null;       // { exports, layout, off } once loaded
  const utf8encode = new TextEncoder();
  const utf8decode = new TextDecoder();

  async function loadWasm() {
    try {
      const res = await fetch("/ghostty-vt.wasm");
      if (!res.ok) return;
      const module = await (WebAssembly.instantiateStreaming && res.headers.get("content-type") === "application/wasm"
        ? WebAssembly.instantiateStreaming(res, { env: { log: () => {} } })
        : res.arrayBuffer().then((b) => WebAssembly.instantiate(b, { env: { log: () => {} } })));
      const exports = module.instance.exports;
      const jsonPtr = exports.ghostty_type_json();
      const mem = new Uint8Array(exports.memory.buffer, jsonPtr);
      const layout = JSON.parse(utf8decode.decode(mem.subarray(0, mem.indexOf(0))));
      // Resolve struct offsets once instead of on every frame.
      const T = layout["GhosttyTerminalOptions"], F = layout["GhosttyFormatterTerminalOptions"];
      const X = layout["GhosttyFormatterTerminalExtra"], S = layout["GhosttyFormatterScreenExtra"];
      const extra = F.fields["extra"].offset;
      wasm = {
        exports,
        off: {
          termSize: T.size, cols: T.fields["cols"], rows: T.fields["rows"], scrollback: T.fields["max_scrollback"],
          fmtSize: F.size, fSize: F.fields["size"], emit: F.fields["emit"], trim: F.fields["trim"],
          extraSizeAt: extra + X.fields["size"].offset, extraSize: X.size,
          paletteAt: extra + X.fields["palette"].offset,
          screenSizeAt: extra + X.fields["screen"].offset + S.fields["size"].offset, screenSize: S.size
        }
      };
    } catch (e) {
      console.warn("ghostty-vt.wasm unavailable, falling back to plain text", e);
    }
  }

  function setField(view, field, value) {
    switch (field.type) {
      case "u8": case "bool": view.setUint8(field.offset, value); break;
      case "u16": view.setUint16(field.offset, value, true); break;
      case "u32": case "enum": view.setUint32(field.offset, value, true); break;
      case "u64": view.setBigUint64(field.offset, BigInt(value), true); break;
      default: throw new Error("unsupported field type: " + field.type);
    }
  }

  // Replay a VT snapshot into a wasm terminal and return the screen as HTML.
  function vtToHTML(vtText, cols, rows) {
    const ex = wasm.exports, o = wasm.off;
    const buf = () => ex.memory.buffer;
    let termPtr = 0, fmtPtr = 0;
    try {
      const termOptsPtr = ex.ghostty_wasm_alloc_u8_array(o.termSize);
      new Uint8Array(buf(), termOptsPtr, o.termSize).fill(0);
      const termOpts = new DataView(buf(), termOptsPtr, o.termSize);
      setField(termOpts, o.cols, cols);
      setField(termOpts, o.rows, rows);
      setField(termOpts, o.scrollback, 0);
      const termPtrPtr = ex.ghostty_wasm_alloc_opaque();
      const newResult = ex.ghostty_terminal_new(0, termPtrPtr, termOptsPtr);
      ex.ghostty_wasm_free_u8_array(termOptsPtr, o.termSize);
      if (newResult !== GHOSTTY_SUCCESS) throw new Error("terminal_new: " + newResult);
      termPtr = new DataView(buf()).getUint32(termPtrPtr, true);
      ex.ghostty_wasm_free_opaque(termPtrPtr);

      const vtBytes = utf8encode.encode(vtText);
      const dataPtr = ex.ghostty_wasm_alloc_u8_array(vtBytes.length);
      new Uint8Array(buf()).set(vtBytes, dataPtr);
      ex.ghostty_terminal_vt_write(termPtr, dataPtr, vtBytes.length);
      ex.ghostty_wasm_free_u8_array(dataPtr, vtBytes.length);

      const fmtOptsPtr = ex.ghostty_wasm_alloc_u8_array(o.fmtSize);
      new Uint8Array(buf(), fmtOptsPtr, o.fmtSize).fill(0);
      const fmtOpts = new DataView(buf(), fmtOptsPtr, o.fmtSize);
      setField(fmtOpts, o.fSize, o.fmtSize);
      setField(fmtOpts, o.emit, GHOSTTY_FORMATTER_FORMAT_HTML);
      setField(fmtOpts, o.trim, 1);
      fmtOpts.setUint32(o.extraSizeAt, o.extraSize, true);
      fmtOpts.setUint8(o.paletteAt, 1);
      fmtOpts.setUint32(o.screenSizeAt, o.screenSize, true);

      const fmtPtrPtr = ex.ghostty_wasm_alloc_opaque();
      const fmtResult = ex.ghostty_formatter_terminal_new(0, fmtPtrPtr, termPtr, fmtOptsPtr);
      ex.ghostty_wasm_free_u8_array(fmtOptsPtr, o.fmtSize);
      if (fmtResult !== GHOSTTY_SUCCESS) throw new Error("formatter_new: " + fmtResult);
      fmtPtr = new DataView(buf()).getUint32(fmtPtrPtr, true);
      ex.ghostty_wasm_free_opaque(fmtPtrPtr);

      const outPtrPtr = ex.ghostty_wasm_alloc_opaque();
      const outLenPtr = ex.ghostty_wasm_alloc_usize();
      const formatResult = ex.ghostty_formatter_format_alloc(fmtPtr, 0, outPtrPtr, outLenPtr);
      if (formatResult !== GHOSTTY_SUCCESS) {
        ex.ghostty_wasm_free_opaque(outPtrPtr);
        ex.ghostty_wasm_free_usize(outLenPtr);
        throw new Error("format_alloc: " + formatResult);
      }
      const outPtr = new DataView(buf()).getUint32(outPtrPtr, true);
      const outLen = new DataView(buf()).getUint32(outLenPtr, true);
      const html = utf8decode.decode(new Uint8Array(buf(), outPtr, outLen));
      ex.ghostty_free(0, outPtr, outLen);
      ex.ghostty_wasm_free_opaque(outPtrPtr);
      ex.ghostty_wasm_free_usize(outLenPtr);
      return html;
    } finally {
      if (fmtPtr) ex.ghostty_formatter_free(fmtPtr);
      if (termPtr) ex.ghostty_terminal_free(termPtr);
    }
  }

  // --- Highlighting (fallback) ------------------------------------------

  const escapeHTML = (s) => s.replace(/[&<>"]/g, (c) =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

  const LINE_RULES = [
    { cls: "hunk", re: /^@@[^@]*@@/ },
    { cls: "add", re: /^\+(?!\+\+)/ },
    // "-" diff line, but not an ls -l permission column (-rw-r--r--)
    { cls: "del", re: /^-(?!--)(?![rwxsStT-]{9}[\s@+])/ },
    { cls: "err", re: /\b(error|fatal|fail(ed|ure)?|exception|panic|denied|traceback|segfault)\b/i },
    { cls: "warn", re: /\b(warn(ing)?|deprecated|caution)\b/i },
    { cls: "good", re: /\b(success(ful(ly)?)?|passed|✓|ok(ay)?\b|done|complete[d]?)\b/i }
  ];
  const TOKEN_RE = /(?:https?:\/\/[^\s'"<>]+)|(?:(?:^|\s)(?:~|\.{1,2})?\/[\w.@~+-]+(?:\/[\w.@~+-]+)*)|(?:(?:^|\s)[❯➜»▶]\s?)/g;

  function highlightLine(line) {
    if (line.length > 500) return escapeHTML(line);
    for (const rule of LINE_RULES) {
      if (rule.re.test(line)) return '<span class="' + rule.cls + '">' + escapeHTML(line) + "</span>";
    }
    let out = "", last = 0, m;
    TOKEN_RE.lastIndex = 0;
    while ((m = TOKEN_RE.exec(line)) !== null) {
      const tok = m[0];
      const lead = tok.match(/^\s*/)[0];
      const core = tok.slice(lead.length);
      const cls = /^https?:\/\//.test(core) ? "url" : /[❯➜»▶]/.test(core) ? "prompt" : "path";
      out += escapeHTML(line.slice(last, m.index)) + lead + '<span class="' + cls + '">' + escapeHTML(core) + "</span>";
      last = m.index + tok.length;
    }
    return out + escapeHTML(line.slice(last));
  }

  // --- Status / API ----------------------------------------------------

  function setStatus(state) {
    $("status").className = "status " + (state || "");
  }

  async function api(cmd, extra) {
    const res = await fetch("/api/cmd", {
      method: "POST",
      headers: { "Content-Type": "application/json", "Authorization": "Bearer " + token },
      body: JSON.stringify(Object.assign({ cmd }, extra || {}))
    });
    if (res.status === 401) {
      showAuth();
      throw new Error("unauthorized");
    }
    return res.json();
  }

  function showAuth() {
    stopLoop();
    $("auth").classList.remove("hidden");
    setStatus("err");
  }

  $("tokeninput").addEventListener("change", (e) => {
    let v = e.target.value.trim();
    const hashIdx = v.indexOf("#");
    if (hashIdx >= 0) v = v.slice(hashIdx + 1);
    if (!v) return;
    token = v;
    store.set("boo_token", token);
    $("auth").classList.add("hidden");
    startLoop();
  });

  // --- Preferences -----------------------------------------------------

  let fontSize = parseInt(store.get("boo_font", "12"), 10) || 12;
  // "auto": all panes when the window is wide enough; "split" / "focus" forced.
  let viewMode = store.get("boo_view", "auto");
  let fitWidth = store.get("boo_fit", "0") === "1";

  function applyFont() {
    $("fontlabel").textContent = String(fontSize);
    store.set("boo_font", String(fontSize));
    fitAll();
  }
  $("fontup").addEventListener("click", () => { if (fontSize < 24) { fontSize++; applyFont(); } });
  $("fontdown").addEventListener("click", () => { if (fontSize > 6) { fontSize--; applyFont(); } });

  $("fit").addEventListener("click", () => {
    fitWidth = !fitWidth;
    store.set("boo_fit", fitWidth ? "1" : "0");
    $("fit").classList.toggle("on", fitWidth);
    fitAll();
  });
  $("fit").classList.toggle("on", fitWidth);

  // Width of one monospace cell per pixel of font size, measured once.
  let cellRatio = 0.6;
  (function measureCell() {
    const probe = el("span", null, "M".repeat(100));
    probe.style.cssText = "position:absolute;visibility:hidden;white-space:pre;font:100px var(--mono)";
    document.body.appendChild(probe);
    const w = probe.getBoundingClientRect().width;
    probe.remove();
    if (w > 0) cellRatio = w / 10000;
  })();

  // --- View model ------------------------------------------------------

  let view = { layout: null, panes: {}, active: "", zoomed: false };
  let state = { workspaces: [], panes: [] };
  const paneNodes = new Map();   // pane id → { root, head, title, count, wrap, screen, hash, cols, rows }
  let layoutKey = "";
  let minimapKey = "";

  function leafIDs(node, out = []) {
    if (!node) return out;
    if (node.id) out.push(node.id);
    else { leafIDs(node.a, out); leafIDs(node.b, out); }
    return out;
  }
  const layoutSig = (n) => !n ? "" : n.id ? n.id : n.dir + (n.ratio * 1000 | 0) + "(" + layoutSig(n.a) + "," + layoutSig(n.b) + ")";

  function showingAll(count) {
    if (count < 2) return false;
    if (viewMode === "split") return true;
    if (viewMode === "focus") return false;
    return window.innerWidth >= 700;
  }

  function paneNode(id) {
    let n = paneNodes.get(id);
    if (n) return n;
    const root = el("section", "pane");
    root.dataset.id = id;
    const head = el("div", "pane-head");
    const title = el("span", "t");
    const count = el("span", "n");
    head.append(title, count);
    const wrap = el("div", "screen-wrap");
    const screen = el("div", "screen");
    wrap.appendChild(screen);
    root.append(head, wrap);
    n = { root, title, count, wrap, screen, hash: null, cols: 0, stick: true };
    wrap.addEventListener("scroll", () => {
      n.stick = wrap.scrollHeight - wrap.scrollTop - wrap.clientHeight < 40;
      if (n.root.classList.contains("active")) updateToBottom();
    }, { passive: true });
    root.addEventListener("click", () => {
      if (id !== view.active) selectPane(id);
    });
    root.addEventListener("dblclick", () => {
      viewMode = "focus";
      store.set("boo_view", viewMode);
      selectPane(id);
    });
    paneNodes.set(id, n);
    return n;
  }

  function buildTree(node) {
    if (node.id) return paneNode(node.id).root;
    const box = el("div", "split " + node.dir);
    const a = buildTree(node.a), b = buildTree(node.b);
    a.style.flex = node.ratio + " 1 0";
    b.style.flex = (1 - node.ratio) + " 1 0";
    box.append(a, b);
    return box;
  }

  function buildMinimap(node) {
    if (!node) return el("span", "mm-leaf active");
    if (node.id) {
      return el("span", "mm-leaf" + (node.id === view.active ? " active" : ""));
    }
    const box = el("span", "mm-split " + node.dir);
    const a = buildMinimap(node.a), b = buildMinimap(node.b);
    a.style.flex = node.ratio + " 1 0";
    b.style.flex = (1 - node.ratio) + " 1 0";
    box.append(a, b);
    return box;
  }

  // Rebuild the DOM tree only when the layout or the display mode changes;
  // pane nodes (and their rendered screens) are reused across rebuilds.
  function renderLayout() {
    const leaves = leafIDs(view.layout);
    const all = showingAll(leaves.length);
    const key = (all ? "all:" : "one:" + view.active + ":") + layoutSig(view.layout);
    const stage = $("stage");
    if (key !== layoutKey) {
      layoutKey = key;
      const ids = new Set(leaves);
      for (const id of paneNodes.keys()) if (!ids.has(id)) paneNodes.delete(id);
      stage.className = all ? "multi" : "single";
      if (!view.layout) {
        stage.replaceChildren(el("div", "placeholder", "No active workspace"));
      } else if (all) {
        stage.replaceChildren(buildTree(view.layout));
      } else {
        const n = paneNode(view.active || leaves[0]);
        n.root.style.flex = "";
        stage.replaceChildren(n.root);
      }
      stage.appendChild(toBottomBtn);
      for (const n of paneNodes.values()) n.stick = true;
      requestAnimationFrame(() => { fitAll(); stickAll(); });
    }
    for (const [id, n] of paneNodes) n.root.classList.toggle("active", id === view.active);
    const mmKey = view.active + layoutSig(view.layout);
    if (mmKey !== minimapKey) {
      minimapKey = mmKey;
      $("viewmode").replaceChildren(buildMinimap(view.layout));
    }
    $("viewmode").title = all ? "Focus the active pane" : "Show all panes";
    const many = leaves.length > 1;
    $("zoom").classList.toggle("hidden", !many && !view.zoomed);
    $("zoom").classList.toggle("on", view.zoomed);
    $("closepane").classList.toggle("hidden", !many);
  }

  // Font size per pane: the user's size, shrunk so all columns fit when the
  // pane is one of several (or "fit width" is on).
  function fitPane(n) {
    const all = $("stage").classList.contains("multi");
    let size = fontSize;
    if ((all || fitWidth) && n.cols > 0) {
      const pad = all ? 12 : 20;
      const avail = n.wrap.clientWidth - pad;
      if (avail > 0) size = Math.min(fontSize, Math.max(3.5, avail / (n.cols * cellRatio)));
    }
    n.screen.style.fontSize = size.toFixed(2) + "px";
  }
  function fitAll() { for (const n of paneNodes.values()) fitPane(n); }
  function stickAll() {
    for (const n of paneNodes.values()) if (n.stick) n.wrap.scrollTop = n.wrap.scrollHeight;
    updateToBottom();
  }

  let resizeRAF = 0;
  new ResizeObserver(() => {
    cancelAnimationFrame(resizeRAF);
    resizeRAF = requestAnimationFrame(() => { renderLayout(); fitAll(); stickAll(); });
  }).observe($("stage"));

  function renderPane(id, p) {
    const n = paneNode(id);
    n.title.textContent = p.title || p.kind || "pane";
    n.count.textContent = p.tabs > 1 ? String(p.tabs) : "";
    if (!p.hash) {
      if (n.hash !== "none:" + p.kind) {
        n.hash = "none:" + p.kind;
        n.cols = 0;
        n.screen.replaceChildren(el("div", "placeholder", (p.kind || "pane") + " · " + (p.title || "not a terminal")));
      }
      return;
    }
    if (p.hash === n.hash) return;
    if (p.vt == null && p.text == null) return;   // server skipped it: client already has it
    let html = null;
    if (wasm && p.vt != null) {
      try { html = vtToHTML(p.vt, p.cols, p.rows); }
      catch (e) { console.warn("wasm render failed, falling back", e); wasm = null; }
    }
    if (html == null) {
      // No styled snapshot to fall back on: strip escape sequences from vt.
      const text = p.text != null ? p.text : (p.vt || "").replace(/\x1b\[[0-9;?]*[ -/]*[@-~]|\x1b\][^\x07\x1b]*(\x07|\x1b\\)|\x1b[()][0-9A-Za-z]|\x1b[=>78]/g, "");
      html = text.split("\n").map(highlightLine).join("\n");
    }
    n.screen.innerHTML = html;
    n.hash = p.hash;
    const resized = n.cols !== p.cols;
    n.cols = p.cols;
    if (resized) fitPane(n);
    if (n.stick) n.wrap.scrollTop = n.wrap.scrollHeight;
  }

  // --- Workspaces / tabs / agents ----------------------------------------

  function pill(label, active, onClick, opts) {
    const b = el("button", "pill" + (active ? " active" : ""));
    if (opts && opts.color) {
      const sw = el("span", "swatch");
      sw.style.background = opts.color;
      b.appendChild(sw);
    }
    b.appendChild(el("span", null, label));
    b.addEventListener("click", onClick);
    if (active) requestAnimationFrame(() => b.scrollIntoView({ inline: "nearest", block: "nearest" }));
    return b;
  }

  let stripKey = "";
  function renderStrips() {
    const activePane = state.panes.find((p) => p.id === view.active)
      || state.panes.find((p) => p.active) || state.panes[0];
    const key = JSON.stringify([state.workspaces, activePane && activePane.tabs]);
    if (key === stripKey) return;
    stripKey = key;

    // Workspaces, grouped when the app has workspace groups.
    const ws = $("workspaces");
    const items = [];
    let lastGroup;
    for (const w of state.workspaces) {
      const group = w.group || "";
      if (group !== lastGroup && (group || lastGroup)) {
        if (items.length) items.push(el("span", "sep"));
        if (group) items.push(el("span", "label", group));
      }
      lastGroup = group;
      items.push(pill(w.name, w.active, () => act(() => api("switch_workspace", { index: w.index })),
        { color: w.color || null }));
    }
    ws.replaceChildren(...(state.workspaces.length > 1 || lastGroup ? items : []));

    const tabs = activePane ? activePane.tabs : [];
    $("tabs").replaceChildren(...tabs.map((t) => pill(t.title || "tab", t.active,
      () => act(async () => {
        if (activePane.id !== view.active) await api("select_pane", { id: activePane.id });
        await api("select_tab", { index: t.index });
      }))).concat([newTabButton()]));
  }

  function newTabButton() {
    const b = el("button", "pill");
    b.setAttribute("aria-label", "New tab");
    b.title = "New tab";
    b.appendChild(svgIcon("#i-plus"));
    b.addEventListener("click", () => act(() => api("new_tab")));
    return b;
  }

  let attention = 0;
  let lastAgents = null;
  let seenRequests = new Set();

  function agentButton(label, color, onClick) {
    const btn = el("button", "key", label);
    if (color) {
      btn.style.background = color;
      btn.style.borderColor = "transparent";
      btn.style.color = "var(--screen-bg)";
    }
    btn.addEventListener("click", async () => {
      btn.disabled = true;
      try { await onClick(); } catch (_) { /* handled by status */ }
      lastAgents = null;
      kick(true);
    });
    return btn;
  }

  async function respond(agent, response) {
    const res = await api("agent_respond", { tab_id: agent.tab_id, response, updated_at: agent.updated_at });
    if (!res.ok) alert(res.error || "Could not answer the agent");
  }

  function renderAgents(agents) {
    attention = agents.filter((a) => a.state === "needs-input").length || agents.length;
    const key = JSON.stringify(agents);
    if (key === lastAgents) return;
    lastAgents = key;

    // Buzz once per new request, not on every redraw.
    const requests = new Set(agents.filter((a) => a.state === "needs-input")
      .map((a) => a.tab_id + "@" + a.updated_at));
    if ([...requests].some((r) => !seenRequests.has(r)) && navigator.vibrate) navigator.vibrate([120, 60, 120]);
    seenRequests = requests;

    $("agents").replaceChildren(...agents.map((agent) => {
      const waiting = agent.state === "needs-input";
      const card = el("div", "agent" + (waiting ? " waiting" : ""));
      const head = el("div", "agent-head");
      head.append(el("b", null, agent.label), el("span", null, agent.summary));
      card.appendChild(head);
      if (agent.preview) {
        const pre = el("pre", null, agent.preview);
        card.appendChild(pre);
        requestAnimationFrame(() => { pre.scrollTop = pre.scrollHeight; });
      }
      const actions = el("div", "agent-actions");
      if (waiting) {
        actions.append(
          agentButton("Approve", "var(--green)", () => respond(agent, "approve")),
          agentButton("Deny", "var(--red)", () => respond(agent, "deny")));
      }
      actions.appendChild(agentButton("Open", null, () => api("agent_jump", { tab_id: agent.tab_id })));
      card.appendChild(actions);
      return card;
    }));
  }

  // --- Refresh ---------------------------------------------------------

  async function refreshState() {
    const s = await api("get_state");
    if (!s.ok) return;
    applyTheme(s.theme);
    renderAgents(s.agents || []);
    state = s;
    renderStrips();
  }

  // Returns true when any pane changed.
  async function refreshView() {
    const known = {};
    for (const [id, n] of paneNodes) if (n.hash && !n.hash.startsWith("none:")) known[id] = n.hash;
    const v = await api("get_view", { known });
    if (!v.ok) return false;
    let changed = false;
    const prevActive = view.active;
    view = { layout: v.layout, panes: v.panes || {}, active: v.active, zoomed: !!v.zoomed };
    renderLayout();
    for (const id of leafIDs(view.layout)) {
      const p = view.panes[id];
      if (!p) continue;
      const before = paneNodes.get(id);
      const prevHash = before && before.hash;
      renderPane(id, p);
      if (paneNodes.get(id).hash !== prevHash) changed = true;
    }
    const active = view.panes[view.active] || {};
    // LRM marks keep "~/…" readable inside the rtl (left-truncating) box.
    $("cwd").textContent = active.cwd ? "\u200E" + active.cwd + "\u200E" : "";
    $("title").textContent = active.title || "remote control";
    document.title = (attention ? "(" + attention + ") " : "")
      + (active.title ? active.title + " — Boo" : "Boo Remote Control");
    if (prevActive !== view.active) { stripKey = ""; renderStrips(); }
    updateToBottom();
    return changed;
  }

  // --- Poll loop -------------------------------------------------------
  // One request chain at a time (no setInterval pile-ups on a slow link),
  // fast right after input or output, slower while the screen sits still,
  // and paused while the page is hidden.

  let timer = null, running = false, inflight = false;
  let lastChange = 0, boostUntil = 0, lastStateAt = 0, forceState = false;

  function nextDelay() {
    const now = performance.now();
    if (now < boostUntil) return 150;
    const idle = now - lastChange;
    if (idle < 3000) return 350;
    if (idle < 20000) return 800;
    return 1600;
  }

  async function loop() {
    timer = null;
    if (!running || document.hidden) return;
    if (inflight) return;
    inflight = true;
    try {
      const now = performance.now();
      const stateEvery = attention ? 1000 : 3000;
      const jobs = [refreshView()];
      if (forceState || now - lastStateAt > stateEvery) {
        forceState = false;
        lastStateAt = now;
        jobs.push(refreshState());
      }
      const [changed] = await Promise.all(jobs);
      if (changed) lastChange = performance.now();
      setStatus("live");
    } catch (e) {
      if (e.message !== "unauthorized") setStatus("err");
    } finally {
      inflight = false;
    }
    if (running && !document.hidden && !timer) timer = setTimeout(loop, nextDelay());
  }

  // Poll soon, then fast for a moment: the user just did something.
  function kick(withState) {
    boostUntil = performance.now() + 2500;
    if (withState) forceState = true;
    if (!running) return;
    clearTimeout(timer);
    timer = setTimeout(loop, 40);
  }

  function startLoop() {
    running = true;
    lastStateAt = 0;
    kick(true);
  }
  function stopLoop() {
    running = false;
    clearTimeout(timer);
    timer = null;
  }

  document.addEventListener("visibilitychange", () => {
    if (!document.hidden && running) kick(true);
  });

  // Run an action, then refresh everything quickly.
  async function act(fn) {
    try { await fn(); } catch (_) { /* status shows it */ }
    stripKey = "";
    kick(true);
  }

  function selectPane(id) {
    view.active = id;
    renderLayout();
    act(() => api("select_pane", { id }));
  }

  // --- Pane controls ---------------------------------------------------

  $("viewmode").addEventListener("click", () => {
    viewMode = showingAll(leafIDs(view.layout).length) ? "focus" : "split";
    store.set("boo_view", viewMode);
    renderLayout();
  });
  $("splitright").addEventListener("click", () => act(() => api("split_pane", { direction: "right" })));
  $("splitdown").addEventListener("click", () => act(() => api("split_pane", { direction: "down" })));
  $("zoom").addEventListener("click", () => act(() => api("zoom_pane", {})));
  $("closepane").addEventListener("click", () => {
    const p = view.panes[view.active];
    if (!confirm("Close pane “" + ((p && p.title) || "pane") + "” and its tabs?")) return;
    act(() => api("close_pane", {}));
  });

  // Swipe left / right on the focused pane to move between panes.
  let touch = null;
  $("stage").addEventListener("touchstart", (e) => {
    if (e.touches.length !== 1) { touch = null; return; }
    touch = { x: e.touches[0].clientX, y: e.touches[0].clientY, t: performance.now() };
  }, { passive: true });
  $("stage").addEventListener("touchend", (e) => {
    if (!touch || showingAll(leafIDs(view.layout).length)) return;
    const t = e.changedTouches[0];
    const dx = t.clientX - touch.x, dy = t.clientY - touch.y;
    const quick = performance.now() - touch.t < 500;
    touch = null;
    if (!quick || Math.abs(dx) < 70 || Math.abs(dy) > Math.abs(dx) * 0.6) return;
    const ids = leafIDs(view.layout);
    if (ids.length < 2) return;
    const i = ids.indexOf(view.active);
    selectPane(ids[(i + (dx < 0 ? 1 : ids.length - 1)) % ids.length]);
  }, { passive: true });

  // --- Scroll to bottom ------------------------------------------------

  const toBottomBtn = el("button", "iconbtn hidden");
  toBottomBtn.id = "tobottom";
  toBottomBtn.title = "Scroll to bottom";
  toBottomBtn.setAttribute("aria-label", "Scroll to bottom");
  toBottomBtn.appendChild(svgIcon("#i-scroll-end"));
  toBottomBtn.addEventListener("click", (e) => {
    e.stopPropagation();
    const n = paneNodes.get(view.active);
    if (n) { n.stick = true; n.wrap.scrollTo({ top: n.wrap.scrollHeight, behavior: "smooth" }); }
  });
  function updateToBottom() {
    const n = paneNodes.get(view.active);
    toBottomBtn.classList.toggle("hidden", !n || n.stick || $("stage").classList.contains("multi"));
  }

  // --- Input -----------------------------------------------------------

  let ctrlOn = false;
  function setCtrl(on) {
    ctrlOn = on;
    $("ctrl").classList.toggle("on", on);
    $("ctrl").setAttribute("aria-pressed", String(on));
  }
  $("ctrl").addEventListener("click", () => setCtrl(!ctrlOn));

  async function sendRaw(text) {
    try { await api("send_text", { text }); } catch (_) { /* status shows it */ }
    kick(false);
  }

  // With ctrl latched, the next character typed goes out as a control code.
  $("cmd").addEventListener("input", (e) => {
    if (!ctrlOn) return;
    const input = e.target;
    const ch = input.value.slice(-1);
    const code = ch.toUpperCase().charCodeAt(0);
    if (code >= 64 && code <= 95) {
      input.value = input.value.slice(0, -1);
      setCtrl(false);
      sendRaw(String.fromCharCode(code - 64));
    }
  });

  $("form").addEventListener("submit", (e) => {
    e.preventDefault();
    const input = $("cmd");
    const text = input.value;
    input.value = "";
    sendRaw(text + "\r");
  });

  document.querySelectorAll(".key[data-key]").forEach((btn) => {
    btn.addEventListener("click", async () => {
      try { await api("send_key", { key: btn.dataset.key }); } catch (_) { /* status shows it */ }
      kick(false);
    });
  });
  document.querySelectorAll(".key[data-raw]").forEach((btn) => {
    // data-raw holds JS-style \uXXXX escapes; decode them once.
    const raw = btn.dataset.raw.replace(/\\u([0-9a-fA-F]{4})/g, (_, h) => String.fromCharCode(parseInt(h, 16)));
    btn.addEventListener("click", () => sendRaw(raw));
  });

  // --- Boot ------------------------------------------------------------

  applyFont();
  loadWasm().then(() => {
    // Re-render everything with the styled renderer.
    for (const n of paneNodes.values()) n.hash = null;
    kick(false);
  });
  if (!token) showAuth();
  else startLoop();
})();
</script>
</body>
</html>
