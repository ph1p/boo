name: Docs

on:
  push:
    branches: [main]
    paths:
      - "documentation/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 12

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: documentation/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: documentation

      - name: Restore published Sparkle appcast
        run: |
          mkdir -p public/updates
          # Only a 404 (no release yet) may leave the appcast out. Any other
          # failure would deploy a site without it and break update checks.
          code=$(curl -sSL --retry 3 -o appcast.tmp -w '%{http_code}' \
            "https://ph1p.github.io/boo/updates/appcast.xml")
          if [ "$code" = "200" ]; then
            mv appcast.tmp public/updates/appcast.xml
          elif [ "$code" = "404" ]; then
            rm -f appcast.tmp
          else
            echo "appcast fetch failed: HTTP $code" >&2
            exit 1
          fi
        working-directory: documentation

      - name: Build
        run: pnpm build
        working-directory: documentation

      - uses: actions/upload-pages-artifact@v5
        with:
          path: documentation/dist/public

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
